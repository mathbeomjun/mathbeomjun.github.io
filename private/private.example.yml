# ═════════════════════════════════════════════════════════════════════
#  private/private.example.yml — 비공개 기록 양식 (이 예시 파일은 공개되어도 무방)
# ═════════════════════════════════════════════════════════════════════
#
#  ▶ 사용법
#    1) 이 파일을 같은 폴더에 private.yml 이라는 이름으로 복사해 실제 내용을 적습니다.
#    2) private.yml 은 .gitignore 에 등록되어 GitHub 에 올라가지 않습니다.
#       단, GitHub 웹페이지에 파일을 직접 끌어다 올리면 .gitignore 가 무시되니 주의.
#       (GitHub Desktop 이나 git 명령으로 올릴 때만 자동 제외됩니다.)
#    3) python build.py --record 를 실행하면 private_out/record.pdf 에만 반영됩니다.
#       홈페이지와 공개 CV에는 절대 나오지 않습니다.
#
#  ▶ 여기에 적을 것: 공개하지 않을 세부 정보
#    연구비 금액·역할, 평가위원 활동, 학위논문 심사, 논문 심사 원고번호, 지도학생, 추천서, 학과 내부 봉사 등.
#  ▶ 여기에 적지 말 것: 공개 CV에도 나올 정보 → data/cv.yml 또는 data/papers.bib
#
#  ▶ 구조
#    paper_notes : 논문별 메모. 키는 papers.bib 의 인용 키(@article{이 부분}). record 의 해당 논문 아래 표시.
#    sections    : 자유 형식 섹션 목록. 각 섹션은 title 과 items(when, what, detail)로 구성.
#                  섹션 제목은 원하는 대로 새로 만들 수 있고, 적힌 순서대로 record 끝에 붙습니다.
#  ▶ 표기: when 은 "2026.07 – 2027.06" 처럼 자유 문자열(따옴표 권장). 확인이 덜 된 항목은 detail 에 "(확인 필요)".
# ─────────────────────────────────────────────────────────────────────

paper_notes:
  ChoiKim2027Example: "예) 투고·승인 일자, 심사 경과."

sections:
  - title: Research grants (details)
    items:
      - when: "2026 – 2031"
        what: "과제명 (과제번호)"
        detail: "예) 역할, 총 연구비, 연차별 금액, 공동연구자"
  - title: Grant and award evaluation
    items:
      - when: "2026.07"
        what: "예) 한국연구재단 OO사업 선정평가"
        detail: "참석 여부, 분야"
  - title: Thesis and admissions committees
    items:
      - when: "2026.11"
        what: "예) 박사학위논문 심사위원 (학생 이름, 지도교수)"
        detail: ""
  - title: Refereeing log
    items:
      - when: "2026.11"
        what: "예) J. Funct. Anal. (원고번호)"
        detail: "요청 / 수락 / 보고서 제출 완료"
  - title: Mentoring and recommendation letters
    items:
      - when: "2026"
        what: "예) 학생 이름, 추천서 대상 기관"
        detail: ""
