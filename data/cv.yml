# ═════════════════════════════════════════════════════════════════════
#  data/cv.yml — 논문을 제외한 모든 이력의 원본 (Single source of truth)
# ═════════════════════════════════════════════════════════════════════
#
#  ▶ 이 파일을 수정하면 무엇이 바뀌나
#    python build.py 를 실행하면(또는 GitHub에 push하면 자동으로) 아래 세 가지가 다시 만들어집니다.
#      web    : 홈페이지 _site/index.html       — 공개, 간결하게
#      cv     : 공개 CV _site/cv.pdf            — 공개, 일반적인 학술 CV 수준
#      record : 전체 기록 private_out/record.pdf — 비공개, 평가·보고용 (python build.py --record)
#
#  ▶ 논문은 여기 없습니다 → data/papers.bib 에 추가하세요.
#  ▶ 공개하면 안 되는 내용(연구비 금액, 학생 이름, 심사 원고번호 등) → private/private.yml
#    이 파일(cv.yml)은 공개 저장소에 올라가므로 누구나 볼 수 있습니다.
#
#  ▶ 무엇이 어디에 보이는지 정하는 세 가지 방법
#    1) 섹션 단위 : 바로 아래 outputs 의 목록에 섹션 이름을 넣거나 뺍니다. 목록 순서 = 출력 순서.
#    2) 항목 단위 : 항목에 hide: [web] / hide: [cv] / hide: [web, cv] 를 붙이면 그 출력에서만 빠집니다.
#                   record 에는 hide 와 상관없이 항상 모두 나옵니다.
#    3) memo     : 항목에 memo: "..." 를 달면 record 에만 작은 글씨로 나옵니다.
#
#  ▶ 공통 표기 규칙
#    - 기간(period): "2025.07 –", "2021.07 – 2025.06", "2024" 처럼 문자열로, 반드시 따옴표.
#      대시는 en dash(–)를 씁니다. 하이픈(-)도 동작은 하지만 모양이 다릅니다.
#    - 콜론(:)이나 따옴표가 들어간 문자열은 전체를 큰따옴표로 감쌉니다.
#      예) title: "MATRIX–RIMS Tandem Workshop: Geometric Flows and Related Phenomena"
#    - 한글 병기: ko: 필드에 적으면 CV/record 에서 제목 뒤 괄호로 붙습니다. 홈페이지에는 안 나옵니다.
#    - 링크: url: 은 외부 주소. file: 은 저장소의 files/ 폴더에 넣은 PDF 경로(예: files/talk.pdf).
#      file 과 url 을 둘 다 주면 홈페이지는 file, CV는 profile.site_url 이 있을 때 file, 없으면 url 을 씁니다.
#    - 항목 순서: 각 목록은 적힌 순서대로 출력됩니다. 최신 항목을 맨 위에 추가하세요.
#      (예외: talks 는 날짜 문자열 그대로 위에서부터 출력되므로 역시 최신을 위에.)
#    - 들여쓰기는 스페이스 2칸. 탭 문자를 쓰면 빌드가 실패합니다.
#
#  ▶ 수정 후 확인
#    로컬: python build.py --no-pdf  (홈페이지만, LaTeX 불필요)  /  python build.py --record (전부)
#    GitHub: push 후 저장소의 Actions 탭에서 초록색 체크가 뜨면 배포 완료.
# ═════════════════════════════════════════════════════════════════════

# ── outputs ─────────────────────────────────────────────────────────
#  각 결과물에 어떤 섹션을 어떤 순서로 넣을지 정합니다.
#  사용 가능한 섹션 이름:
#    summary(record 전용 통계), interests, positions, education, publications, preprints,
#    grants, service, referee, organized, teaching, talks, notes
#  홈페이지(web)는 템플릿 구조상 publications→preprints→positions→… 순서가 고정이며,
#  여기서는 '보일지 말지'만 결정합니다. cv/record 는 이 목록 순서대로 조판됩니다.
outputs:
  web:    [publications, preprints, positions, education, organized, grants, service, teaching, notes]
  cv:     [interests, positions, education, publications, preprints, grants, service, organized, teaching, talks, notes]
  record: [summary, interests, positions, education, publications, preprints, grants, service, referee, organized, teaching, talks, notes]

